Open  index.html , tap  Edit , delete everything, and paste this:
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: Arial, sans-serif;
      background: #07111f; color: #fff; display: grid; place-items: center;
    }
    .app {
      width: min(700px, 100%); min-height: 100vh; padding: 24px;
      display: flex; flex-direction: column;
    }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { margin: 0; color: #58d6ff; }
    .badge { background: #123c35; color: #7fffd4; padding: 8px 12px; border-radius: 20px; }
    #chat { flex: 1; padding: 28px 0; display: flex; flex-direction: column; gap: 14px; }
    .message {
      max-width: 82%; padding: 14px 16px; border-radius: 18px; line-height: 1.4;
    }
    .jarvis { background: #132a46; align-self: flex-start; }
    .user { background: #0a7ea4; align-self: flex-end; }
    form { display: flex; gap: 10px; padding-top: 12px; }
    input {
      flex: 1; border: 0; border-radius: 24px; padding: 16px;
      font-size: 16px; outline: none;
    }
    button {
      border: 0; border-radius: 24px; padding: 0 20px;
      background: #58d6ff; color: #00131d; font-weight: bold; font-size: 16px;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>JARVIS</h1>
      <span class="badge">Online</span>
    </header>

    <section id="chat">
      <div class="message jarvis">
        Hello. I’m Jarvis, your personal assistant. How can I help today?
      </div>
    </section>

    <form id="form">
      <input id="input" placeholder="Ask Jarvis anything..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      chat.innerHTML += `<div class="message user">${text}</div>`;
      input.value = "";

      setTimeout(() => {
        chat.innerHTML += `<div class="message jarvis">
          I’m still being built, but I received: “${text}”.
        </div>`;
        window.scrollTo(0, document.body.scrollHeight);
      }, 500);
    });
  </script>
</body>
</html>
